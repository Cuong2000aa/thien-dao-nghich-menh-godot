name: "cloudflare pages"

## Deploy Godot Web export to Cloudflare Pages (Direct Upload via Wrangler).
## Do NOT build Godot inside Cloudflare — their build env has no Godot templates.
##
## Required GitHub Actions secrets (repo Settings → Secrets):
##   CLOUDFLARE_API_TOKEN   — token with Account.Cloudflare Pages:Edit
##   CLOUDFLARE_ACCOUNT_ID  — from Cloudflare dashboard → Workers & Pages → Account ID

on:
  push:
    branches: [tdnm-web, master, main]
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch, tag or commit"
        type: string
        default: ""

concurrency:
  group: cloudflare-pages
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  build:
    uses: ./.github/workflows/export.yml
    with:
      ref: ${{ inputs.ref }}
      mode: release
      features: production
      targets: Web
    secrets: inherit

  deploy:
    runs-on: ubuntu-latest
    needs: build
    name: Deploy to Cloudflare Pages
    steps:
      - name: Download Web build
        uses: actions/download-artifact@v5
        with:
          name: Web
          path: site

      - name: Add Cloudflare _headers (COOP/COEP for Godot/SQLite)
        run: |
          # Flatten if Godot nested index.html one level down
          if [ ! -f site/index.html ]; then
            nested=$(find site -maxdepth 3 -name index.html | head -1)
            if [ -n "$nested" ]; then
              dir=$(dirname "$nested")
              echo "Using nested export dir: $dir"
              shopt -s dotglob
              mv "$dir"/* site/ 2>/dev/null || cp -a "$dir"/. site/
            fi
          fi
          printf '%s\n' \
            '/*' \
            '  Cross-Origin-Opener-Policy: same-origin' \
            '  Cross-Origin-Embedder-Policy: require-corp' \
            '  Cross-Origin-Resource-Policy: cross-origin' \
            > site/_headers
          ls -la site | head -30
          test -f site/index.html

      - name: Publish to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site --project-name=thien-dao-nghich-menh-godot --branch=tdnm-web --commit-dirty=true
