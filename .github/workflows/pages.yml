name: "web pages"

on:
  push:
    branches: [master, main, tdnm-web]
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch, tag or commit"
        type: string
        default: ""
  workflow_call:
    inputs:
      ref:
        type: string
        default: ""

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    uses: ./.github/workflows/export.yml
    with:
      ref: ${{ inputs.ref }}
      mode: release
      features: production
      targets: Web
    secrets: inherit

  deploy:
    runs-on: ubuntu-latest
    needs: build
    name: Deploy to GitHub Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Download Web build
        uses: actions/download-artifact@v5
        with:
          name: Web
          path: site

      - name: Normalize site root + cache-bust note
        run: |
          if [ ! -f site/index.html ]; then
            nested=$(find site -maxdepth 3 -name index.html | head -1)
            if [ -n "$nested" ]; then
              dir=$(dirname "$nested")
              shopt -s dotglob nullglob
              mv "$dir"/* site/
            fi
          fi
          # Godot may still emit unused index.side.wasm; threads mode is authoritative in index.html
          if [ -f site/index.html ] && grep -q 'GODOT_THREADS_ENABLED = true' site/index.html; then
            echo "::error::Threaded Web export detected (GODOT_THREADS_ENABLED=true)."
            exit 1
          fi
          rm -f site/index.side.wasm
          # Sentry web GDExtension has been crashing assignWasmExports on Pages; strip if present
          rm -f site/libsentry*.wasm site/sentry-bundle.js
          if [ -f site/index.html ]; then
            python3 - <<'PY'
from pathlib import Path
import re
p = Path("site/index.html")
t = p.read_text()
t2 = re.sub(r',"libsentry[^"]*"', "", t)
t2 = re.sub(r'"libsentry[^"]*",?', "", t2)
t2 = t2.replace(",,", ",").replace("[,", "[").replace(",]", "]")
# Kill stale PWA service workers from older threaded deploys
bust = """<script>
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.getRegistrations().then(function(rs){ rs.forEach(function(r){ r.unregister(); }); });
  if (window.caches) caches.keys().then(function(ks){ ks.forEach(function(k){ caches.delete(k); }); });
}
</script>
"""
if "serviceWorker.getRegistrations" not in t2:
    t2 = t2.replace("<head>", "<head>\n" + bust, 1)
    # also try after <head ...>
    if bust.strip() not in t2:
        t2 = re.sub(r"(<head[^>]*>)", r"\1\n" + bust, t2, count=1)
p.write_text(t2)
print(re.search(r"gdextensionLibs\":\[[^\]]*\]", t2).group(0) if re.search(r"gdextensionLibs\":\[[^\]]*\]", t2) else "no libs")
PY
          fi
          if ! ls site/libgdsqlite*.nothreads.wasm >/dev/null 2>&1; then
            echo "::warning::No nothreads sqlite wasm found — account create may fail on Pages."
          fi
          ls -lah site | head -40
          test -f site/index.html
          grep -n 'GODOT_THREADS_ENABLED\|gdextensionLibs' site/index.html || true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
