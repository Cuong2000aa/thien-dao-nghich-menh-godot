name: "web pages"

on:
  push:
    branches: [master, main, tdnm-web]
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch, tag or commit"
        type: string
        default: ""
  workflow_call:
    inputs:
      ref:
        type: string
        default: ""

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    uses: ./.github/workflows/export.yml
    with:
      ref: ${{ inputs.ref }}
      mode: release
      features: production
      targets: Web
    secrets: inherit

  deploy:
    runs-on: ubuntu-latest
    needs: build
    name: Deploy to GitHub Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Download Web build
        uses: actions/download-artifact@v5
        with:
          name: Web
          path: site

      - name: Normalize site root + cache-bust note
        run: |
          if [ ! -f site/index.html ]; then
            nested=$(find site -maxdepth 3 -name index.html | head -1)
            if [ -n "$nested" ]; then
              dir=$(dirname "$nested")
              shopt -s dotglob nullglob
              mv "$dir"/* site/
            fi
          fi
          # Godot may still emit unused index.side.wasm; threads mode is authoritative in index.html
          if [ -f site/index.html ] && grep -q 'GODOT_THREADS_ENABLED = true' site/index.html; then
            echo "::error::Threaded Web export detected (GODOT_THREADS_ENABLED=true)."
            exit 1
          fi
          rm -f site/index.side.wasm
          # Sentry web GDExtension has been crashing assignWasmExports on Pages; strip if present
          rm -f site/libsentry*.wasm site/sentry-bundle.js
          if [ -f site/index.html ]; then
            # Strip libsentry from GODOT_CONFIG gdextensionLibs
            sed -E -i \
              -e 's/,"libsentry[^"]*"//g' \
              -e 's/"libsentry[^"]*",?//g' \
              -e 's/,,/,/g' \
              -e 's/\[,/[/g' \
              -e 's/,\]/]/g' \
              site/index.html
            # Kill stale PWA service workers from older threaded deploys
            if ! grep -q 'serviceWorker.getRegistrations' site/index.html; then
              sed -i 's|<head>|<head><script>if("serviceWorker"in navigator){navigator.serviceWorker.getRegistrations().then(function(rs){rs.forEach(function(r){r.unregister()})});if(window.caches)caches.keys().then(function(ks){ks.forEach(function(k){caches.delete(k)})})}</script>|' site/index.html
            fi
          fi
          if ! ls site/libgdsqlite*.nothreads.wasm >/dev/null 2>&1; then
            echo "::warning::No nothreads sqlite wasm found — account create may fail on Pages."
          fi
          ls -lah site | head -40
          test -f site/index.html
          grep -n 'GODOT_THREADS_ENABLED\|gdextensionLibs' site/index.html || true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
