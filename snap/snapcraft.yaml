name: source-of-mana
base: core24
adopt-info: game
summary: Thiên Đạo Nghịch Mệnh — tu tiên 2D (Godot)
description: |
  Thiên Đạo Nghịch Mệnh is a 2D cultivation (tu tiên) RPG built with Godot.
  Explore Trúc Sơn, train martial skills, and play solo or with friends.
  Technical foundation forked from Source of Mana (MIT).
license: MIT AND CC-BY-SA-4.0
icon: data/press/logo/logo_seed.svg
grade: stable
confinement: strict

platforms:
  amd64:
    build-on: [amd64]
    build-for: [amd64]

layout:
  /usr/share/source-of-mana:
    bind: $SNAP/usr/share/source-of-mana

apps:
  source-of-mana:
    command: usr/share/source-of-mana/source-of-mana.x86_64
    extensions:
      - gnome
    plugs:
      - network
      - network-bind
      - opengl
      - audio-playback
      - joystick
    environment:
      LD_LIBRARY_PATH: $SNAP/usr/share/source-of-mana:$LD_LIBRARY_PATH

parts:
  game:
    plugin: dump
    source: .
    override-build: |
      craftctl set version="$(grep -oP 'config/version="\K[^"]+' "$SNAPCRAFT_PROJECT_DIR/project.godot")"
      mkdir -p $SNAPCRAFT_PART_INSTALL/usr/share/source-of-mana
      cp "$SNAPCRAFT_PROJECT_DIR/ThienDaoNghichMenh.x86_64" $SNAPCRAFT_PART_INSTALL/usr/share/source-of-mana/source-of-mana.x86_64
      chmod 755 $SNAPCRAFT_PART_INSTALL/usr/share/source-of-mana/source-of-mana.x86_64
      cp "$SNAPCRAFT_PROJECT_DIR"/*.so $SNAPCRAFT_PART_INSTALL/usr/share/source-of-mana/
      mkdir -p $SNAPCRAFT_PART_INSTALL/meta/gui
      cp "$SNAPCRAFT_PROJECT_DIR/snap/gui/source-of-mana.desktop" $SNAPCRAFT_PART_INSTALL/meta/gui/
      cp "$SNAPCRAFT_PROJECT_DIR/data/press/logo/logo_seed.svg" $SNAPCRAFT_PART_INSTALL/meta/gui/
    stage-packages:
      - libgl1
      - libglu1-mesa
      - libasound2t64
      - libpulse0
      - libx11-6
      - libxcursor1
      - libxi6
      - libxinerama1
      - libxrandr2
      - libxrender1
      - libfontconfig1
      - libdbus-1-3
